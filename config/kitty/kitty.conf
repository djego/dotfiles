#: Fonts -------------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

#: Cursor -------------------------------------------------------------------

cursor_shape        beam
cursor_blink_interval 0

#: Scrollback ----------------------------------------------------------------

scrollback_lines 10000

#: Mouse ----------------------------------------------------------------------

copy_on_select yes
mouse_hide_wait 3.0

#: Window layout ---------------------------------------------------------------

window_padding_width 6
confirm_os_window_close 0

#: Transparency ----------------------------------------------------------------

background_opacity 0.75
dynamic_background_opacity yes
background_blur 20

#: Tab bar -----------------------------------------------------------------

tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style angled

#: Shell integration -----------------------------------------------------------

shell /usr/bin/zsh
shell_integration enabled

#: Misc ----------------------------------------------------------------------

# pacman manages kitty on this system; no need for kitty's own update checks
update_check_interval 0

#: Keybindings -------------------------------------------------------------


#: Color scheme ----------------------------------------------------------------

include theme.conf
