$base = rgba(30, 30, 46, 1.0)
$surface0 = rgba(49, 50, 68, 1.0)
$surface2 = rgba(88, 91, 112, 1.0)
$text = rgba(205, 214, 244, 1.0)
$subtext0 = rgba(166, 173, 200, 1.0)
$mauve = rgba(203, 166, 247, 1.0)

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/djego/Pictures/Wallpapers/catppuccin-mocha-purple-horizon.jpg
    blur_passes = 3
    blur_size = 7
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $text
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d de %B')"
    color = $subtext0
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
